name: Test Update Process

on:
  workflow_dispatch: # Manual trigger only for testing

permissions:
  contents: read

jobs:
  test-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install dependencies
        run: |
          nix-env -iA nixpkgs.jq
          nix-env -iA nixpkgs.curl

      - name: Test version checking
        run: |
          echo "Testing version detection..."
          CURRENT_VERSION=$(grep -oP 'version = "\K[^"]+' packages/openshell/package.nix)
          echo "Current version: $CURRENT_VERSION"

          LATEST_VERSION=$(curl -sL https://api.github.com/repos/NVIDIA/OpenShell/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "Latest version: $LATEST_VERSION"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "✅ Version check works - found difference"
          else
            echo "✅ Version check works - versions match"
          fi

      - name: Test Cargo.lock fetch
        run: |
          VERSION=$(grep -oP 'version = "\K[^"]+' packages/openshell/package.nix)
          echo "Testing Cargo.lock fetch for version $VERSION..."

          curl -sL "https://raw.githubusercontent.com/NVIDIA/OpenShell/v${VERSION}/Cargo.lock" \
            -o /tmp/test-Cargo.lock

          if [ -s /tmp/test-Cargo.lock ]; then
            echo "✅ Cargo.lock fetch works"
          else
            echo "❌ Cargo.lock fetch failed"
            exit 1
          fi

      - name: Test package build
        run: |
          echo "Testing package build..."
          nix build .#openshell --print-build-logs || echo "⚠️ Build failed (expected if hash is placeholder)"

      - name: Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Version checking works" >> $GITHUB_STEP_SUMMARY
          echo "✅ Cargo.lock fetching works" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The update workflow is ready to use!" >> $GITHUB_STEP_SUMMARY
